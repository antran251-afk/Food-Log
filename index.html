'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), id=()=>crypto.randomUUID(), key='food-log.v1';
const nutrients=['Calories','Protein (g)','Carbs (g)','Fat (g)','Fiber (g)','Sodium (mg)','Potassium (mg)','Iron (mg)','Vitamin C (mg)','Calcium (mg)','Magnesium (mg)'];

function extendNutrients(data) {
  for(const entry of [...data.foods,...data.logs]){
    if(entry.n.length<nutrients.length){
      entry.n=nutrients.map((_,i)=>entry.n[i]??null);
    }
  }
  return data;
}
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const weekdays=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const weekLabel=new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'});
const profileFields=[
  ['weight','Current weight (lb)',0.01],
  ['height','Height (in)',0.01],
  ['bodyFat','Body fat (%)',0,100],
  ['goalWeight','Goal weight (lb)',0.01]
];
const parseDay=value=>new Date(value+'T12:00:00');
function addDays(date, days) {
  const result=new Date(date);
  result.setDate(result.getDate()+days);
  return result;
}
function monday(date) {
  return addDays(date,-((date.getDay()+6)%7));
}
function selectDay(value) {
  const latest=dateKey(addDays(monday(new Date()),6));
  $('day').value=value&&value<=latest?value:dateKey(new Date());
  render();
}
function renderWeek() {
  const selected=val('day');
  const start=monday(parseDay(selected));
  const end=addDays(start,6);
  const nextDisabled=dateKey(start)>=dateKey(monday(new Date()));
  $('day').max=dateKey(addDays(monday(new Date()),6));
  $('week').innerHTML='<div class="week-heading">'+
    '<button type="button" id="prevWeek" aria-label="Previous week">←</button>'+
    '<strong>'+esc(weekLabel.formatRange?.(start,end)??weekLabel.format(start)+' – '+weekLabel.format(end))+'</strong>'+
    '<button type="button" id="nextWeek" aria-label="Next week" '+(nextDisabled?'disabled':'')+'>→</button></div>'+
    weekdays.map((name,i)=>{
      const date=addDays(start,i);
      const value=dateKey(date);
      const active=value===selected;
      return '<button type="button" class="week-day '+(active?'active':'')+'" aria-pressed="'+active+
        '" aria-label="'+esc(name+' '+weekLabel.format(date))+'" data-day="'+value+'"><span>'+name+'</span>'+date.getDate()+'</button>';
    }).join('');
  $('prevWeek').onclick=()=>selectDay(dateKey(addDays(parseDay(selected),-7)));
  $('nextWeek').onclick=()=>selectDay(dateKey(addDays(parseDay(selected),7)));
  $('week').querySelectorAll('[data-day]').forEach(button=>{
    button.onclick=()=>selectDay(button.dataset.day);
  });
}
$('day').value=dateKey(new Date());
const field=(name,label,type='text',extra='')=>'<label>'+esc(label)+'<input id="'+name+'" type="'+type+'" '+extra+'></label>';

const val=k=>$(k).value, food=k=>db.foods.find(f=>f.id===k), fmt=n=>Number(n.toFixed(1)), msg=s=>$('status').textContent=s;
function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch(e){alert('Storage failed. Export a backup before closing.');throw e}}
function opts(items) {

function ingredientFoods() {

function catalogWords(text) {
  return text.toLowerCase().match(/[a-z0-9]+/g)??[];
}
function matchingFoods(query) {
  const words=catalogWords(query);
  if(!words.length) return [];
  foodCatalog??=JSON.parse($('usdaCatalog').textContent);
  const matches=[];
  for(const row of foodCatalog){
    const nameWords=catalogWords(row[0]);
    if(!words.every(word=>nameWords.some(nameWord=>nameWord.startsWith(word)))) continue;
    const score=(nameWords[0]?.startsWith(words[0])?0:100)+nameWords.length;
    matches.push({row,score});
  }
  return matches.sort((a,b)=>a.score-b.score||a.row[0].localeCompare(b.row[0]))
    .slice(0,12).map(match=>match.row);
}
function searchFoods(event) {

function barcodeDigits(value) {
  return (value||'').replace(/[\s-]/g,'');
}
function sameBarcode(a,b) {
  return a&&b&&barcodeDigits(a).padStart(14,'0')===barcodeDigits(b).padStart(14,'0');

async function lookup() {
  stopScan();
  lookupRequest?.abort();
  const code=barcodeDigits(val('code'));
  const info=$('lookupInfo');
  if(!/^\d{8,14}$/.test(code)){
    info.textContent='Enter the digits printed below the bars, including the small digits at each end.';
    return;
  }
  $('code').value=code;
  const saved=db.foods.find(item=>sameBarcode(item.code,code));
  if(saved){
    render('Daily');
    selectLogFood(saved);
    msg('Loaded '+saved.name+' from your saved foods.');
    return;
  }
  const request=new AbortController();
  lookupRequest=request;
  let timedOut=false;
  const timeout=setTimeout(()=>{timedOut=true;request.abort()},12000);
  info.textContent='Looking up '+code+'…';
  try {
    const alternate=code.length===12?'0'+code:code.length===13&&code.startsWith('0')?code.slice(1):null;
    let product;
    for(const candidate of [code,alternate].filter(Boolean)){
      const url='https://world.openfoodfacts.org/api/v2/product/'+candidate+
        '.json?fields=product_name,nutriments,serving_size,nutrition_data_per,product_quantity_unit';
      const response=await fetch(url,{signal:request.signal});
      if(response.status===404) continue;
      if(!response.ok) throw Error('Lookup service returned '+response.status);
      product=(await response.json()).product;
      if(product) break;
    }
    if(request.signal.aborted) return;
    if(!product){
      info.textContent='No match for '+code+' in Open Food Facts. Enter the label below and save it for next time.';
      return;
    }
    const n=product.nutriments||{};
    $('name').value=product.product_name||'';
    if(n['energy-kcal_100g']==null||!Number.isFinite(Number(n['energy-kcal_100g']))||
      /ml/i.test(product.nutrition_data_per||'')||/^ml$/i.test(product.product_quantity_unit||'')){
      info.textContent='Product found. Enter the serving weight and nutrition from the label below.';
      return;
    }
    const serving=product.serving_size?.match(/(\d+(?:[.,]\d+)?)\s*g\b/i);
    const grams=Number(serving?.[1].replace(',','.'))||100;
    $('base').value=grams;
    $('cup').value='';
    ['energy-kcal','proteins','carbohydrates','fat','fiber','sodium','potassium','iron','vitamin-c','calcium','magnesium'].forEach((name,i)=>{
      const value=n[name+'_100g'];
      $('n'+i).value=value==null||!Number.isFinite(Number(value))?'':fmt(value*(i>=5?1000:1)*grams/100);
    });
    info.textContent='Product found. Review the values per '+grams+' g and save the food below.';
  } catch {
    if(!request.signal.aborted||timedOut){
      info.textContent='Could not reach Open Food Facts for '+code+'. Try again or enter the label below.';
    }
  } finally {
    clearTimeout(timeout);
    if(lookupRequest===request) lookupRequest=null;
  }
}

async function barcodeReader() {
  if(!window.ZXingBrowser){
    scannerLibrary??=new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
      script.onload=resolve;
      script.onerror=()=>{scannerLibrary=null;script.remove();reject(Error('Scanner library unavailable'))};
      document.head.append(script);
    });
    await scannerLibrary;
  }
  return new ZXingBrowser.BrowserMultiFormatReader();
}
function readBarcode(reader,source,width,height) {
  const frame=document.createElement('canvas');
  for(const rotate of [false,true]){
    frame.width=rotate?height:width;
    frame.height=rotate?width:height;
    const context=frame.getContext('2d',{willReadFrequently:true});
    if(rotate){context.translate(height,0);context.rotate(Math.PI/2)}
    context.drawImage(source,0,0,width,height);
    try {
      const code=reader.decodeFromCanvas(frame).getText();
      if(/^\d{8,14}$/.test(code)) return code;
    } catch {
      // Try again with a rotated frame or the next camera frame.
    }
  }
}
function barcodeFound(code) {
  $('code').value=code;
  lookup();
}
async function scan() {
  stopScan();
  lookupRequest?.abort();
  const version=scanVersion;
  const info=$('lookupInfo');
  info.textContent='Opening camera…';
  try {
    const reader=await barcodeReader();
    if(version!==scanVersion) return;
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false
    });
    if(version!==scanVersion){stream.getTracks().forEach(track=>track.stop());return}
    camera=stream;
    const video=$('video');
    $('scanControls').hidden=false;
    video.srcObject=stream;
    await video.play();
    if(version!==scanVersion) return;
    const readFrame=()=>video.videoWidth&&readBarcode(reader,video,video.videoWidth,video.videoHeight);
    $('captureBarcode').disabled=false;
    $('captureBarcode').onclick=()=>{
      const code=readFrame();
      if(code) barcodeFound(code);
      else info.textContent='No barcode in that frame. Hold the package steady with all bars visible, then try again.';
    };
    info.textContent='Scanning automatically. You can also tap Capture barcode.';
    scanTimer=setInterval(()=>{
      const code=readFrame();
      if(code) barcodeFound(code);
    },350);
  } catch {
    if(version!==scanVersion) return;
    stopScan();
    info.textContent='Camera scan unavailable. Use a barcode photo or enter the digits above.';
  }
}
async function scanPhoto(event) {
  const file=event.target.files[0];
  event.target.value='';
  if(!file) return;
  stopScan();
  lookupRequest?.abort();
  const version=scanVersion;
  const info=$('lookupInfo');
  info.textContent='Reading barcode photo…';
  const url=URL.createObjectURL(file);
  try {
    const image=new Image();
    image.src=url;
    await image.decode();
    const reader=await barcodeReader();
    if(version!==scanVersion) return;
    const code=readBarcode(reader,image,image.naturalWidth,image.naturalHeight);
    if(code) barcodeFound(code);
    else info.textContent='No barcode found in that photo. Try a sharper photo or enter the digits above.';
  } catch {
    if(version===scanVersion) info.textContent='Could not read that photo. Try another photo or enter the digits above.';
  } finally {
    URL.revokeObjectURL(url);
  }
}

const dailyValues=[2000,50,275,78,28,2300,4700,18,90,1300,420];

function suggestedGoals(goalWeight,proteinRate=defaultProteinRate) {
  const values=[...dailyValues];

const activityLevels={
  sedentary:{label:'Sedentary · mostly sitting',factor:1.4},
  light:{label:'Light · some walking or exercise',factor:1.6},
  moderate:{label:'Moderate · active most days',factor:1.8},
  veryActive:{label:'Very active · hard exercise or physical work',factor:2.0}
};
const equationSexes={female:-161,male:5};
function calorieEstimates({weight,goalWeight,height,age,activity,equationSex}) {
  const factor=activityLevels[activity]?.factor;
  const adjustment=Object.hasOwn(equationSexes,equationSex)?equationSexes[equationSex]:null;
  if(![weight,height].every(value=>Number.isFinite(value)&&value>0)||
    !Number.isInteger(age)||age<18||!factor||adjustment===null) return null;
  const heightCm=height*2.54;
  const resting=10*weight*0.45359237+6.25*heightCm-5*age+adjustment;
  const maintenance=Math.round(resting*factor/10)*10;
  if(!Number.isFinite(maintenance)||resting<=0) return null;
  const direction=Number.isFinite(goalWeight)&&goalWeight>0?Math.sign(goalWeight-weight):0;
  if(direction===0) return {maintenance,options:[]};
  if(direction<0&&goalWeight*0.45359237/(heightCm/100)**2<18.5){
    return {maintenance,options:[],reason:'Choose a higher goal weight to see weight-loss estimates.'};
  }
  const options=[['Steady',direction>0?300:-250],['Faster',direction*500]].map(([label,offset])=>{
    const calories=maintenance+offset;
    return {label,offset,calories:calories>=resting?calories:null};
  });
  return {maintenance,options};
}

      const source=i===1&&goalWeight>0&&rate()>0?' · based on goal weight':'';
      const mode=i===1&&proteinOverride?' · manual override':'';
      $('suggest'+i).textContent=(i===5?'Suggested limit ':'Suggested ')+value+source+mode;
    });
  }
  nutrients.forEach((_,i)=>{
    $('suggestButton'+i).onclick=()=>{
      if(i===1){
        proteinOverride=false;
        showSuggestions();
      } else {
        $('goal'+i).value=suggestions(estimates())[i];
        if(i===0) highlightCalorieEstimate();
      }
    };
  });
  $('goal0').oninput=highlightCalorieEstimate;
  $('goal1').oninput=()=>{
    proteinOverride=true;
    showSuggestions();
  };
  for(const key of ['weight','goalWeight','heightFeet','heightInches','age','equationSex','activity']){
    $(key).oninput=showSuggestions;
  }
  $('proteinRate').oninput=showSuggestions;
  showSuggestions();
  $('applySuggestions').onclick=()=>{
    const values=suggestions(estimates());
    if(val('goal1')===''){
      proteinOverride=false;
      showSuggestions();
    }
    values.forEach((value,i)=>{
      if(val('goal'+i)==='') $('goal'+i).value=value;
    });
    highlightCalorieEstimate();
  };
  $('bodyDetails').addEventListener('invalid',()=>{$('bodyDetails').open=true},true);
  $('setupForm').onsubmit=e=>{
    e.preventDefault();
    const inches=$('heightInches');
    const height=heightInches();
    if(Number(inches.value)>=12||(height===0&&(val('heightFeet')!==''||inches.value!==''))){
      $('bodyDetails').open=true;
      inches.setCustomValidity(Number(inches.value)>=12?'Enter fewer than 12 inches.':'Enter a height greater than zero.');
      inches.reportValidity();
      inches.setCustomValidity('');
      return;
    }
    const profile=Object.fromEntries(profileFields.filter(([key])=>key!=='height')
      .map(([key])=>[key,val(key)===''?null:+val(key)]));
    profile.height=height||null;
    profile.age=val('age')===''?null:Number(val('age'));
    profile.equationSex=val('equationSex')||null;
    profile.activity=val('activity')||null;
    profile.proteinRate=rate();
    profile.proteinOverride=proteinOverride;
    if(!Number.isFinite(profile.proteinRate)||profile.proteinRate<=0) return msg('Enter a positive protein rate in grams per pound.');
    if(!validProfile(profile)) return msg('Check the body measurements and try again.');
    const goals=nutrients.map((_,i)=>+val('goal'+i));
    const updated={...db,profile,goals};
    try {
      localStorage.setItem(key,JSON.stringify(updated));
      db=updated;
      msg('Setup saved.');
    } catch {
      msg('Could not save setup. Check available storage and try again.');
    }
  };
}
function validProfile(profile) {
  return profile===undefined||(
    profile!==null&&typeof profile==='object'&&!Array.isArray(profile)&&
    (profile.age==null||(Number.isInteger(profile.age)&&profile.age>=18))&&
    (profile.equationSex==null||Object.hasOwn(equationSexes,profile.equationSex))&&
    (profile.activity==null||Object.hasOwn(activityLevels,profile.activity))&&
    (profile.proteinRate===undefined||(Number.isFinite(profile.proteinRate)&&profile.proteinRate>0))&&
    (profile.proteinOverride===undefined||typeof profile.proteinOverride==='boolean')&&
    profileFields.every(([key,,min,max])=>{
      const value=profile[key];
      return value==null||(Number.isFinite(value)&&value>=min&&(max===undefined||value<=max));
    })
  );
}
function backup(){$('main').innerHTML='<section><h2>Backup & restore</h2><p>Save a copy of your foods, recipes, batches, daily log, and setup. Restoring replaces this device’s saved data.</p><button id="export">Export backup</button><label>Restore backup<input id="restore" type=file accept=".json"></label></section>'+
  '<section><details><summary>Data sources</summary>'+
  '<p>Barcode lookup uses <a href="https://world.openfoodfacts.org/">Open Food Facts</a> (<a href="https://opendatacommons.org/licenses/odbl/1-0/">ODbL</a>).</p>'+
  '<p>Food search uses <a href="https://fdc.nal.usda.gov/download-datasets/">USDA FoodData Central, SR Legacy</a>.</p>'+
  '<p>Calorie estimates use the <a href="https://pubmed.ncbi.nlm.nih.gov/2305711/">Mifflin–St Jeor equation</a> and an activity multiplier. See the <a href="https://www.niddk.nih.gov/bwp">NIH Body Weight Planner</a>.</p>'+
  '<p>Nutrition goal references include <a href="https://www.fda.gov/food/nutrition-facts-label/daily-value-nutrition-and-supplement-facts-labels">FDA Daily Values</a>, the <a href="https://www.nal.usda.gov/human-nutrition-and-food-safety/dri-calculator">USDA intake calculator</a>, and the <a href="https://nap.nationalacademies.org/skim.php?chap=565-578&amp;record_id=25353">adult protein reference</a>.</p>'+
  '</details></section>';$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='food-log-'+val('day')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};$('restore').onchange=async e=>{try{let b=JSON.parse(await e.target.files[0].text());let uuid=x=>typeof x==='string'&&/^[a-f0-9-]{36}$/i.test(x),nums=x=>Array.isArray(x)&&(x.length===9||x.length===nutrients.length)&&x.every(v=>v===null||Number.isFinite(v)),positive=x=>Number.isFinite(x)&&x>0;if(!validProfile(b.profile)||!Array.isArray(b.foods)||!Array.isArray(b.logs)||!Array.isArray(b.goals)||b.goals.length>nutrients.length||!b.goals.every(Number.isFinite)||!b.foods.every(f=>uuid(f.id)&&typeof f.name==='string'&&(positive(f.base)||(f.base===null&&(f.parts||f.batch===true)))&&nums(f.n)&&(f.batchServings===undefined||(f.batch===true&&Number.isFinite(f.batchServings)&&f.batchServings>0))&&(!f.parts||Array.isArray(f.parts)&&f.parts.every(p=>positive(p.g)&&b.foods.some(x=>x.id===p.food&&!x.parts))))||!b.logs.every(r=>uuid(r.id)&&typeof r.name==='string'&&(positive(r.g)||r.g===null)&&(!r.share?r.g!==null:positive(r.share)&&r.share<=1&&typeof r.fractionText==='string'&&['Fraction of recipe','Fraction of batch'].includes(r.fractionUnit))&&nums(r.n)&&/^\d{4}-\d\d-\d\d$/.test(r.day)))throw Error();if(confirm('Replace local data with this backup?')){const restored=extendNutrients(b);localStorage.setItem(key,JSON.stringify(restored));db=restored;render('Daily')}}catch{msg('Could not restore this backup.')}}}
render();
</script></html>
