<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>Food Log</title>
<style>
*{box-sizing:border-box}body{margin:auto;max-width:780px;background:#f6f4ec;color:#233c32;font:16px system-ui;padding:20px}header,nav,.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}header{justify-content:space-between}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:2.6rem;margin:10px 0}nav{margin:14px 0 20px}button,input,select{font:inherit;border:1px solid #bac4b6;border-radius:10px;padding:10px;max-width:100%}button{background:#fff;color:#234738;cursor:pointer}button.active,button.primary{background:#265740;color:white}section,article{background:#fffefa;padding:20px;border-radius:18px;margin:12px 0}section.hero{background:#244c3d;color:white}.hero strong{font:3rem Georgia}label{display:grid;gap:4px;margin:10px 0;font-size:.9rem}input,select{min-width:0;width:100%;background:white;color:#22372c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0 10px}small{color:#536757}p{line-height:1.45}video{width:100%}hr{border:0;border-top:1px solid #ddd}button:disabled{opacity:.55}
</style><header><h1>Food Log</h1><input aria-label="Diary date" type=date id=day style="width:auto"></header><nav id=nav></nav><main id=main></main><p id=status role=status></p>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), id=()=>crypto.randomUUID(), key='food-log.v1';
const nutrients=['Calories','Protein (g)','Carbs (g)','Fat (g)','Fiber (g)','Sodium (mg)','Potassium (mg)','Iron (mg)','Vitamin C (mg)'];
let db=JSON.parse(localStorage.getItem(key)||'{"foods":[],"logs":[],"goals":[]}'),tab='Diary',camera,scanVersion=0;
const dateKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
$('day').value=dateKey(new Date());
const field=(name,label,type='text',extra='')=>'<label>'+esc(label)+'<input id="'+name+'" type="'+type+'" '+extra+'></label>';
const num=(name,label,required=false)=>field(name,label,'number','step="any" min="0" '+(required?'required':''));
const val=k=>$(k).value, food=k=>db.foods.find(f=>f.id===k), fmt=n=>Number(n.toFixed(1)), msg=s=>$('status').textContent=s;
function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch(e){alert('Storage failed. Export a backup before closing.');throw e}}
function opts(batch=false){return db.foods.filter(f=>!batch||!f.parts).map(f=>'<option value="'+esc(f.id)+'">'+esc(f.name)+'</option>').join('')}
function total(rows,i){return rows.reduce((a,r)=>a+(r.n[i]??0),0)}
function render(next=tab){camera?.stop();camera=null;scanVersion++;tab=next;msg('');$('nav').innerHTML=['Diary','Foods','Batches','Progress','Backup'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="render(this.textContent)">'+t+'</button>').join('');({Diary:diary,Foods:foods,Batches:batches,Progress:progress,Backup:backup})[tab]()}
$('day').onchange=()=>render();
function diary(){let rows=db.logs.filter(r=>r.day===val('day'));$('main').innerHTML='<section class="hero">Daily calories<br><strong>'+fmt(total(rows,0))+'</strong> kcal'+(db.goals[0]?' / '+db.goals[0]:'')+'<p>'+nutrients.slice(1,4).map((n,i)=>fmt(total(rows,i+1))+' g '+n.split(' ')[0].toLowerCase()).join(' · ')+'</p></section><section><h2>Log a portion</h2>'+ (db.foods.length?'<form id="log"><label>Food or cooked batch<select id="which">'+opts()+'</select></label><div class="grid">'+field('amount','Amount','number','required step="any"')+'<label>Unit<select id="unit"></select></label></div><p id="preview"></p><button class="primary">Add to diary</button></form>':'<button onclick="render(\'Foods\')">Add your first food</button>')+'</section><section><h2>Diary entries</h2>'+ (rows.map(r=>'<p><b>'+esc(r.name)+'</b> · '+fmt(r.g)+' g · '+fmt(r.n[0])+' kcal <button onclick="editLog(\''+r.id+'\')">Edit</button> <button onclick="repeatLog(\''+r.id+'\')">Repeat</button></p>').join('')||'No entries for this day.')+'</section>';
if(!$('log'))return;let grams=()=>{let a=Number(val('amount')),u=val('unit'),f=food(val('which'));return u==='Removal (g)'?Math.abs(a):a*({'oz':28.349523125,'servings':f.base,'cups':f.cup}[u]||1)};
function preview(){let g=grams();$('preview').textContent=g>0?fmt(g)+' g · '+fmt(g*food(val('which')).n[0]/food(val('which')).base)+' kcal':''}
$('which').onchange=()=>{let f=food(val('which'));$('unit').innerHTML=['g','Removal (g)','oz','servings',...(f.cup?['cups']:[])].map(x=>'<option>'+x+'</option>').join('');preview()};$('which').onchange();$('log').oninput=preview;$('log').onsubmit=e=>{e.preventDefault();let f=food(val('which')),g=grams();if(!(g>0))return msg('Enter a positive portion or choose Removal (g).');db.logs.push({id:id(),day:val('day'),name:f.name,g,n:f.n.map(x=>x===null?null:x*g/f.base)});save();render()}}
function repeatLog(k){db.logs.push({...db.logs.find(r=>r.id===k),id:id(),day:val('day')});save();render()}
function editLog(k){let r=db.logs.find(r=>r.id===k),s=prompt('Portion in grams. Enter 0 to remove.',r.g);if(s===null||s.trim()==='')return;let g=Number(s);if(!Number.isFinite(g)||g<0)return;if(g===0)db.logs=db.logs.filter(x=>x!==r);else{r.n=r.n.map(x=>x===null?null:x*g/r.g);r.g=g}save();render()}
function foods(){ $('main').innerHTML='<section><h2>Package lookup</h2>'+field('code','Barcode','text','inputmode="numeric"')+'<div class="row"><button onclick="scan()">Scan with camera</button><button onclick="lookup()">Look up code</button></div><video id="video" playsinline muted hidden></video><p id="lookupInfo" role=status></p><small>Product data from <a href="https://world.openfoodfacts.org/">Open Food Facts</a> (ODbL).</small></section><section><h2>Save a food</h2><form id="newFood">'+field('name','Food name','text','required')+'<div class="grid">'+num('base','Grams per serving',true)+num('cup','Grams per cup (optional)')+'</div><p>Nutrition per serving</p><div class="grid">'+nutrients.map((n,i)=>num('n'+i,n,i===0)).join('')+'</div><button class="primary">Save food</button></form></section>';
$('newFood').onsubmit=e=>{e.preventDefault();if(+val('base')<=0)return msg('Serving weight must exceed zero.');let code=val('code').trim();if(code&&db.foods.some(f=>f.code===code))return lookup();db.foods.push({id:id(),name:val('name'),base:+val('base'),cup:+val('cup'),code,n:nutrients.map((_,i)=>val('n'+i)===''?null:+val('n'+i))});save();render('Diary');$('which').value=db.foods.at(-1).id;$('which').onchange()}}
async function lookup(){let code=val('code').trim(),saved=db.foods.find(f=>code&&f.code===code);if(saved){render('Diary');$('which').value=saved.id;$('which').onchange();return}let info=$('lookupInfo');if(!/^\d{8,14}$/.test(code)){info.textContent='Enter the digits printed below the barcode.';return}info.textContent='Looking up product…';try{let res=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json');let p=(await res.json()).product;if(!p)throw Error();if(!info.isConnected||val('code').trim()!==code)return;let n=p.nutriments||{};if((p.nutrition_data_per||'').includes('ml')||/\bml\b/i.test(p.product_quantity_unit||''))throw Error();$('name').value=p.product_name||'';$('base').value=100;$('cup').value='';['energy-kcal','proteins','carbohydrates','fat','fiber','sodium','potassium','iron','vitamin-c'].forEach((k,i)=>{$('n'+i).value=n[k+'_100g']==null?'':fmt(n[k+'_100g']*(i>=5?1000:1))});info.textContent='Review these values per 100 g against the label before saving.'}catch{info.textContent='Enter the package label below to save this barcode.'}}
async function scan(){let version=++scanVersion;camera?.stop();try{if(!window.ZXingBrowser)await new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';s.onload=ok;s.onerror=no;document.head.append(s)});if(version!==scanVersion)return;$('video').hidden=false;let controls=await new ZXingBrowser.BrowserMultiFormatReader().decodeFromVideoDevice(undefined,$('video'),(result,err,c)=>{if(!result||version!==scanVersion)return;scanVersion++;c.stop();$('video').hidden=true;$('code').value=result.getText();lookup()});if(version===scanVersion)camera=controls;else controls.stop()}catch{if(version===scanVersion)$('lookupInfo').textContent='Camera unavailable. Type the barcode below the printed bars.'}}
function batches(){let templates=db.foods.filter(f=>f.parts);$('main').innerHTML='<section><h2>Cook a batch</h2>'+(!opts(true)?'<button onclick="render(\'Foods\')">Save an ingredient first</button>':'<form id="batch"><label>Start from<select id="template"><option value="">New recipe</option>'+templates.map(f=>'<option value="'+f.id+'">'+esc(f.name)+'</option>').join('')+'</select></label>'+field('title','Batch name','text','required')+'<div id="ingredients"></div><button type="button" onclick="ingredient()">Add ingredient</button>'+num('yield','Finished cooked weight (g)',true)+'<button class="primary">Save cooked batch</button></form>')+'</section>';if(!$('batch'))return;ingredient();$('template').onchange=()=>{let f=food(val('template'));$('ingredients').innerHTML='';$('title').value=f?.name||'';$('yield').value='';if(f)f.parts.forEach(p=>ingredient(p));else ingredient()};$('batch').onsubmit=e=>{e.preventDefault();let parts=[...$('ingredients').children].map(el=>({food:el.querySelector('select').value,g:+el.querySelector('input').value}));if(!parts.length||parts.some(p=>p.g<=0)||+val('yield')<=0)return msg('Add an ingredient and enter positive weights.');let n=nutrients.map((_,i)=>parts.some(p=>food(p.food).n[i]===null)?null:parts.reduce((sum,p)=>sum+food(p.food).n[i]*p.g/food(p.food).base,0));db.foods.push({id:id(),name:val('title')+'',base:+val('yield'),parts,n});save();render('Diary');$('which').value=db.foods.at(-1).id;$('which').onchange()}}
function ingredient(p){let el=document.createElement('div');el.className='grid';el.innerHTML='<label>Ingredient<select>'+opts(true)+'</select></label><label>Weight (g)<input type="number" min="0" step="any" required></label><button type="button" onclick="this.parentElement.remove()">Remove</button>';if(p){el.querySelector('select').value=p.food;el.querySelector('input').value=p.g}$('ingredients').append(el)}
function progress(){let end=val('day'),d=new Date(end+'T12:00:00');d.setDate(d.getDate()-6);let rows=db.logs.filter(r=>r.day>=dateKey(d)&&r.day<=end);$('main').innerHTML='<section><h2>Seven days ending '+esc(end)+'</h2><p>'+new Set(rows.map(r=>r.day)).size+' days logged · averages span all seven days</p><form id="targets">'+nutrients.map((n,i)=>'<hr><b>'+n+'</b><p>'+fmt(total(rows.filter(r=>r.day===end),i))+' today · '+fmt(total(rows,i)/7)+' daily average'+(db.goals[i]?' / '+db.goals[i]+' goal':'')+(rows.some(r=>r.n[i]==null)?' · incomplete data':'')+'</p>'+num('goal'+i,'Daily goal')).join('')+'<button class="primary">Save goals</button></form></section>';db.goals.forEach((g,i)=>$('goal'+i).value=g||'');$('targets').onsubmit=e=>{e.preventDefault();db.goals=nutrients.map((_,i)=>+val('goal'+i));save();render();msg('Goals saved.')}}
function backup(){$('main').innerHTML='<section><h2>Backup & restore</h2><p>Save a copy of your foods, batches, diary, and goals. Restoring replaces this device’s diary.</p><button id="export">Export backup</button><label>Restore backup<input id="restore" type=file accept=".json"></label></section>';$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='food-log-'+val('day')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};$('restore').onchange=async e=>{try{let b=JSON.parse(await e.target.files[0].text());let uuid=x=>typeof x==='string'&&/^[a-f0-9-]{36}$/i.test(x),nums=x=>Array.isArray(x)&&x.length===nutrients.length&&x.every(v=>v===null||Number.isFinite(v)),positive=x=>Number.isFinite(x)&&x>0;if(!Array.isArray(b.foods)||!Array.isArray(b.logs)||!Array.isArray(b.goals)||b.goals.length>nutrients.length||!b.goals.every(Number.isFinite)||!b.foods.every(f=>uuid(f.id)&&typeof f.name==='string'&&positive(f.base)&&nums(f.n)&&(!f.parts||Array.isArray(f.parts)&&f.parts.every(p=>positive(p.g)&&b.foods.some(x=>x.id===p.food&&!x.parts))))||!b.logs.every(r=>uuid(r.id)&&typeof r.name==='string'&&positive(r.g)&&nums(r.n)&&/^\d{4}-\d\d-\d\d$/.test(r.day)))throw Error();if(confirm('Replace local data with this backup?')){localStorage.setItem(key,JSON.stringify(b));db=b;render('Diary')}}catch{msg('Could not restore this backup.')}}}
render();
</script></html>
